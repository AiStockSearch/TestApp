name: Android CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from the UI

jobs:
  lint-and-test:
    name: ⬢ Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.29.1

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm lint

  build-android:
    name: 🤖 Build & Sign Android Release
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.29.1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Ruby (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1.4'
          bundler-cache: true
          working-directory: android

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Decode Keystore File
        run: |
          echo "${{ secrets.MYAPP_RELEASE_STORE_FILE_BASE64 }}" | base64 --decode > android/app/release.keystore
      - name: Configure Android SDK Location
        run: |
          if [ -d "/usr/lib/android-sdk" ]; then
            echo "sdk.dir=/usr/lib/android-sdk" > android/local.properties
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          elif [ -d "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          else
            echo "⚠️ Could not automatically verify Android SDK directory path."
            echo "sdk.dir=/usr/lib/android-sdk" > android/local.properties
          fi
          echo "Generated android/local.properties contents:"
          cat android/local.properties
      - name: Run Fastlane Beta / Build
        env:
          ANDROID_HOME: /usr/lib/android-sdk
          ANDROID_SDK_ROOT: /usr/lib/android-sdk
          
          MYAPP_RELEASE_STORE_FILE: "debug.keystore"
          MYAPP_RELEASE_STORE_PASSWORD: "android"
          MYAPP_RELEASE_KEY_ALIAS: "androiddebugkey"
          MYAPP_RELEASE_KEY_PASSWORD: "android"
        run: pnpm build:android

      - name: Upload Artifacts (APK / AAB)
        uses: actions/upload-artifact@v4
        with:
          name: android-release-package
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 7